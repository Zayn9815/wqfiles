name: Build iOS IPA

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned WQFiles.ipa
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          if [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build and validate unsigned WQFiles.ipa
        run: ./build.sh

      - name: Upload WQFiles.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: WQFiles-unsigned-ipa
          path: WQFiles.ipa
          if-no-files-found: error
          retention-days: 30
