name: Build Android WQGlass Transfer

on:
  push:
    paths:
      - "android/WQGlassTransfer/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "android/WQGlassTransfer/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Android unit tests
        working-directory: android/WQGlassTransfer
        run: gradle test --no-daemon

      - name: Build installable Android APK
        working-directory: android/WQGlassTransfer
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk WQGlassTransfer.apk

      - name: Upload WQGlassTransfer.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: WQGlassTransfer-Android
          path: android/WQGlassTransfer/WQGlassTransfer.apk
          if-no-files-found: error
